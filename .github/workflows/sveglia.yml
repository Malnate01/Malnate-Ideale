name: Sveglia Streamlit
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Avvia browser
        uses: microsoft/playwright-github-action@v1
      - name: Visita app
        run: |
          npm init -y
          npm install playwright
          node -e "const { chromium } = require('playwright'); (async () => { const b = await chromium.launch(); const p = await b.newPage(); await p.goto('https://malnate-ideale-qion9xz8svsrtbmjkmqyk3.streamlit.app/?embed=true', { waitUntil: 'networkidle' }); await p.waitForTimeout(10000); await b.close(); })();"
