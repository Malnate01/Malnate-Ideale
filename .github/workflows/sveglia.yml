name: Sveglia Streamlit
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Installa Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Visita app Streamlit
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('https://malnate-ideale-qion9xz8svsrtbmjkmqyk3.streamlit.app/?embed=true', timeout=60000)
              page.wait_for_timeout(15000)
              if page.locator('text=Yes, get this app back up!').is_visible():
                  page.locator('text=Yes, get this app back up!').click()
                  page.wait_for_timeout(30000)
              browser.close()
          "
